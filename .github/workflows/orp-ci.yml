name: ORP v3.0 Integrity Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  orp-integrity:
    name: ORP Structural & Governance Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate folder structure
        run: |
          echo "=== ORP v3.0 Directory Structure Validation ==="
          REQUIRED_DIRS=("Architecture" "Runtime" "Evaluation" "Governance" "Layers" "Docs" "public")
          MISSING=()

          for dir in "${REQUIRED_DIRS[@]}"; do
            if [ -d "$dir" ]; then
              echo "✅ $dir/"
            else
              echo "⚠️ $dir/ (missing)"
              MISSING+=("$dir")
            fi
          done

          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "⚠️ Missing directories: ${MISSING[*]}"
            exit 1
          fi
          echo "✅ All required directories present"

      - name: Validate core files
        run: |
          echo "=== Core Files Validation ==="
          FILES=(
            "Architecture/ORP_CORE_SPEC.md"
            "Runtime/ORP_RUNTIME.md"
            "Runtime/ORP_PROMPT.md"
            "Architecture/ORP_SYSTEM_ARCHITECTURE.md"
            "Architecture/ORP_SYSTEM_MAP.md"
            "Architecture/ORP_META_MAP.md"
          )

          for file in "${FILES[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ $file"
            else
              echo "⚠️ $file (missing)"
              exit 1
            fi
          done

      - name: Validate key subsystems
        run: |
          echo "=== Subsystem Validation ==="
          SUBSYSTEMS=(
            "Governance/ORP_SIGMA_SQUARED_DRIFT.md"
            "Governance/ORP_MODEL_DECAY_TRACKER.md"
            "Governance/ORP_ANTI_DEGRADATION.md"
            "Governance/ORP_DRIFT_RECOVERY_PROTOCOL.md"
            "Governance/ORP_FAILURE_MODES_CATALOG.md"
            "Evaluation/ORP_EVALUATION_SCHEMA.md"
            "Layers/ORP_L1_SIGNAL_SCHEMA.md"
          )

          for sub in "${SUBSYSTEMS[@]}"; do
            if [ -f "$sub" ]; then
              echo "✅ $sub"
            else
              echo "⚠️ $sub (missing)"
              exit 1
            fi
          done

      - name: Check mandatory runtime header
        run: |
          echo "=== Mandatory Header Check ==="
          # Regex matches the required ORP header components
          if grep -qE "\[SHS:|\[DRIFT:|\[CRA:|\[LAS:" Runtime/ORP_RUNTIME.md; then
            echo "✅ Mandatory header present in ORP_RUNTIME.md"
          else
            echo "⚠️ Mandatory header not found in ORP_RUNTIME.md"
            exit 1
          fi

      - name: Final Status
        run: |
          echo ""
          echo "========================================"
          echo "ORP v3.0 Integrity Validation Completed"
          echo "========================================"
          echo "Status: PASSED"
