name: ORP v3.0 Integrity Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  orp-integrity:
    name: ORP Structural & Governance Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate folder structure
        run: |
          echo "=== ORP v3.0 Directory Structure Validation ==="

          REQUIRED_DIRS=("Architecture" "Runtime" "Evaluation" "Governance" "layers" "Docs" "public")
          MISSING=()

          for dir in "${REQUIRED_DIRS[@]}"; do
            if [ -d "$dir" ]; then
              echo "✅ $dir/"
            else
              echo "⚠️  $dir/ (missing)"
              MISSING+=("$dir")
            fi
          done

          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "⚠️ Missing directories: ${MISSING[*]}"
          else
            echo "✅ All required directories present"
          fi

      - name: Validate core files
        run: |
          echo "=== Core Files Validation ==="
          FILES=(
            "Architecture/ORP_CORE_SPEC.md"
            "Runtime/ORP_RUNTIME.md"
            "Runtime/ORP_PROMPT.md"
            "Architecture/ORP_SYSTEM_ARCHITECTURE.md"
            "Architecture/ORP_SYSTEM_MAP.md"
            "Architecture/ORP_META_MAP.md"
          )

          for file in "${FILES[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ $file"
            else
              echo "⚠️  $file (missing)"
            fi
          done

      - name: Validate key subsystems
        run: |
          echo "=== Subsystem Validation ==="

          test -f Governance/ORP_SIGMA_SQUARED_DRIFT.md \
            && echo "✅ σ² Drift Model" \
            || echo "⚠️ σ² Drift Model missing"

          test -f Governance/ORP_MODEL_DECAY_TRACKER.md \
            && echo "✅ Model Decay Tracker" \
            || echo "⚠️ Model Decay Tracker missing"

          test -f Governance/ORP_ANTI_DEGRADATION.md \
            && echo "✅ Anti-Degradation" \
            || echo "⚠️ Anti-Degradation missing"

          test -f Governance/ORP_DRIFT_RECOVERY_PROTOCOL.md \
            && echo "✅ Drift Recovery Protocol" \
            || echo "⚠️ Drift Recovery Protocol missing"

          test -f Governance/ORP_FAILURE_MODES_CATALOG.md \
            && echo "✅ Failure Modes Catalog" \
            || echo "⚠️ Failure Modes Catalog missing"

          test -f Evaluation/ORP_EVALUATION_SCHEMA.md \
            && echo "✅ Evaluation Schema" \
            || echo "⚠️ Evaluation Schema missing"

          test -f layers/ORP_L1_SIGNAL_SCHEMA.md \
            && echo "✅ L1 Signal Schema" \
            || echo "⚠️ L1 Signal Schema missing"

      - name: Check mandatory runtime header
        run: |
          echo "=== Mandatory Header Check ==="

          # Single-line regex — YAML-safe, grep-safe
          if grep -E "

\[SHS:|

\[DRIFT:|

\[CRA:|

\[LAS:" Runtime/ORP_RUNTIME.md > /dev/null; then
            echo "✅ Mandatory header present in ORP_RUNTIME.md"
          else
            echo "⚠️ Mandatory header not found in ORP_RUNTIME.md"
          fi

      - name: Final Status
        run: |
          echo ""
          echo "========================================"
          echo "ORP v3.0 Integrity Validation Completed"
          echo "========================================"
          echo "Status: PASSED (warnings allowed during development)"
