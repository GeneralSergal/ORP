name: ORP v3.0 Integrity Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  orp-integrity:
    name: ORP Structural & Governance Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate folder structure
        run: |
          echo "=== ORP v3.0 Directory Structure Validation ==="

          REQUIRED_DIRS=("core" "drift" "evaluation" "layers" "recovery" "conceptual" "docs")
          MISSING=()

          for dir in "${REQUIRED_DIRS[@]}"; do
            if [ -d "$dir" ]; then
              echo "✅ $dir/"
            else
              echo "⚠️  $dir/ (missing)"
              MISSING+=("$dir")
            fi
          done

          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "⚠️ Some directories are missing: ${MISSING[*]}"
            echo "This is acceptable during active development."
          else
            echo "✅ All core directories present"
          fi

      - name: Validate core files
        run: |
          echo "=== Core Files Validation ==="
          FILES=("core/ORP_RUNTIME.md" "core/ORP_PROMPT.md" "core/ORP_CORE_SPEC.md")
          for file in "${FILES[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ $file"
            else
              echo "⚠️  $file (missing)"
            fi
          done

      - name: Validate key subsystems
        run: |
          echo "=== Subsystem Validation ==="
          test -f drift/ORP_SIGMA_SQUARED_DRIFT.md && echo "✅ Drift model" || echo "⚠️ Drift model missing"
          test -f evaluation/ORP_EVALUATION_SCHEMA.md && echo "✅ Evaluation schema" || echo "⚠️ Evaluation schema missing"
          test -f layers/ORP_L1_SIGNAL_SCHEMA.md && echo "✅ L1 schema" || echo "⚠️ L1 schema missing"

      - name: Check mandatory runtime header
        run: |
          echo "=== Mandatory Header Check ==="
          if head -n 30 core/ORP_RUNTIME.md | grep -E "\[SHS:|\[DRIFT:|\[CRA:|\[LAS:" > /dev/null; then
            echo "✅ Mandatory header present in ORP_RUNTIME.md"
          else
            echo "⚠️ Mandatory header not found in ORP_RUNTIME.md"
          fi

      - name: Final Status
        run: |
          echo ""
          echo "========================================"
          echo "ORP v3.0 Integrity Validation Completed"
          echo "========================================"
          echo "Status: PASSED (with warnings allowed)"
