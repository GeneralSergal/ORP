name: ORP v3.0 Integrity Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  orp-integrity:
    name: ORP Structural & Governance Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate folder structure
        run: |
          echo "=== Checking canonical ORP directory layout ==="
          test -d core
          test -d conceptual
          test -d docs
          test -d drift
          test -d evaluation
          test -d layers
          test -d recovery
          echo "✅ All required directories present"

      - name: Validate core files
        run: |
          echo "=== Checking core files ==="
          test -f core/ORP_RUNTIME.md
          test -f core/ORP_PROMPT.md
          test -f core/ORP_CORE_SPEC.md
          test -f core/ORP_SYSTEM_ARCHITECTURE.md
          echo "✅ Core files OK"

      - name: Validate key subsystems
        run: |
          echo "=== Checking drift subsystem ==="
          test -f drift/ORP_SIGMA_SQUARED_DRIFT.md
          test -f drift/ORP_MODEL_DECAY_TRACKER.md
          test -f drift/ORP_ANTI_DEGRADATION.md

          echo "=== Checking evaluation files ==="
          test -f evaluation/ORP_EVALUATION_SCHEMA.md
          test -f evaluation/ORP_RUBRIC.md

          echo "=== Checking layers ==="
          test -f layers/ORP_L1_SIGNAL_SCHEMA.md
          echo "✅ Subsystems OK"

      - name: Check mandatory runtime header
        run: |
          echo "=== Checking mandatory header in ORP_RUNTIME.md ==="
          head -n 30 core/ORP_RUNTIME.md | grep -E "\[SHS:|\[DRIFT:|\[CRA:|\[LAS:" > /dev/null
          echo "✅ Mandatory header present"

      - name: Final Status
        run: |
          echo "✅ ORP v3.0 Integrity Validation PASSED"
          echo "All critical structure and files verified."
