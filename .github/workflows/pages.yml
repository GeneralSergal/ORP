name: Deploy ORP Docs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare deployment directory
        run: |
          mkdir -p public

          # Copy index.html if present
          if [ -f index.html ]; then
            cp index.html public/
          fi

          # Copy avatar if present
          if [ -f avatar.jpg ]; then
            cp avatar.jpg public/
          fi

          # Copy docs directory if non-empty
          if [ -d docs ] && [ "$(ls -A docs 2>/dev/null)" ]; then
            cp -R docs public/
          fi

          # Ensure artifact is never empty
          if [ ! -f public/index.html ]; then
            echo "<h1>ORP Documentation</h1>" > public/index.html
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
