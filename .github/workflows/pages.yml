name: Deploy ORP Docs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create staging directory
        run: mkdir -p public

      - name: Stage all files
        # This copies everything from the root, excluding hidden .git files 
        # and the 'public' folder itself if it exists, into the staging area.
        run: |
          rsync -av --exclude='.git' --exclude='.github' --exclude='public' ./ public/

      - name: Verify index.html exists
        run: |
          if [ ! -f public/index.html ]; then
            echo "Error: index.html not found in repository root."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
