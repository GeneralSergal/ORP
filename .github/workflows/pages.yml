name: Deploy ORP Docs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare deployment directory
        run: |
          # Create clean production staging area
          mkdir -p public
          
          # Copy your main cyberpunk interface file from the root
          if [ -f index.html ]; then
            cp index.html public/
          fi
          
          # Copy any asset dependencies (like avatar.jpg) if they exist in the root
          if [ -f avatar.jpg ]; then
            cp avatar.jpg public/
          fi

          # Safely mirror your structural docs subfolder if it exists
          if [ -d docs ]; then
            cp -R docs/* public/
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
