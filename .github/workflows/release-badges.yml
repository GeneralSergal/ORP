name: ORP Release & Badge Update

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  update-badges:
    name: Update Version Badges & Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version in README.md
        run: |
          echo "Updating version badges in README.md..."
          sed -i 's/ORP-v[0-9.]\+/ORP-v3.0/' README.md || true
          sed -i 's/badge\/Version-.*-blue/badge\/Version-v3.0-blue/' README.md || true

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add README.md
            git commit -m "chore: update version badges after v3.0 release"
            git push
          fi

      - name: Success Notification
        run: echo "✅ Version badges and documentation updated for ORP v3.0"
