name: ORP Release & Badge Update

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  update-badges:
    name: Update Version Badges & Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from release tag
        id: extract_version
        run: |
          VERSION=${{ github.event.release.tag_name }}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Update version badges in README.md
        run: |
          echo "Updating version badges to ${{ steps.extract_version.outputs.version }}..."

          # Update version badge
          sed -i "s|ORP-v[0-9.]*|ORP-${{ steps.extract_version.outputs.version }}|g" README.md || true
          
          # Update any other version mentions if needed
          sed -i "s|Version-v[0-9.]*|Version-${{ steps.extract_version.outputs.version }}|g" README.md || true

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet; then
            echo "No changes detected."
          else
            git add README.md
            git commit -m "chore: update version badges to ${{ steps.extract_version.outputs.version }} [skip ci]"
            git push
            echo "✅ Version badges updated and committed."
          fi

      - name: Final Status
        run: echo "✅ Successfully updated badges for version ${{ steps.extract_version.outputs.version }}"
