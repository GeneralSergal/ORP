<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

  <!--
    ORP Δ — Icon Sprite Sheet
    Usage: <svg><use href="assets/icons.svg#logo-mark"/></svg>
  -->

  <!-- ── Logo mark: glowing nested-triangle sigil ──────────────
       Dimensions: 100×100 viewBox (scale via width/height on <use>)
       Colors: outer #dd1111 · mid #ff4400 · inner #ff6600
       Requires: the filter IDs are local to this symbol; callers
       do NOT need to redeclare them.
  ──────────────────────────────────────────────────────────── -->
  <symbol id="logo-mark" viewBox="0 0 100 100">
    <defs>
      <filter id="logo-glow" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="2.5" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
    <polygon points="50,8 92,80 8,80"
             fill="none" stroke="#dd1111" stroke-width="6" stroke-linejoin="round"
             filter="url(#logo-glow)"/>
    <polygon points="50,26 78,72 22,72"
             fill="none" stroke="#ff4400" stroke-width="5" stroke-linejoin="round"
             filter="url(#logo-glow)"/>
    <polygon points="50,44 65,65 35,65"
             fill="none" stroke="#ff6600" stroke-width="4" stroke-linejoin="round"
             filter="url(#logo-glow)"/>
  </symbol>

  <!-- ── Favicon mark: flat nested-triangle sigil (no glow)  ──
       Same geometry as favicon.svg but as a reusable symbol.
       Background tile is NOT included here — favicon.svg is the
       self-contained file for <link rel="icon">; this symbol is
       for embedding the glyph alone inside other UI surfaces.
  ──────────────────────────────────────────────────────────── -->
  <symbol id="favicon-mark" viewBox="0 0 100 100">
    <g stroke="#dd1111" stroke-width="8" fill="none"
       stroke-linecap="round" stroke-linejoin="round">
      <polygon points="50,20 82,75 18,75"/>
      <polygon points="50,35 69,68 31,68"/>
      <polygon points="50,50 56,60 44,60"/>
    </g>
  </symbol>

</svg>
