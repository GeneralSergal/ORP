<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" width="100%" height="100%" style="display: block; margin: 0 auto; background: transparent;">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Oxanium:wght@700;800&amp;family=Space+Grotesk:wght@500&amp;display=swap');
      .prov-v-title { font-family: 'Oxanium', sans-serif; font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; }
      .prov-v-subtitle { font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: 500; letter-spacing: 0.02em; opacity: 0.85; }
    </style>

    <marker id="prov-arr-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 Z" fill="#ff6600"/>
    </marker>
    <marker id="prov-arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 Z" fill="#dd1111"/>
    </marker>
    <marker id="prov-arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 Z" fill="#6a3a8a"/>
    </marker>
  </defs>

  <g transform="translate(60, 20)">
    <rect width="200" height="54" rx="6" fill="#161a22" stroke="#ff6600" stroke-width="2"/>
    <text x="100" y="24" fill="#f0f4f9" class="prov-v-title" text-anchor="middle">ORP</text>
    <text x="100" y="39" fill="#f0f4f9" class="prov-v-title" text-anchor="middle">Governance</text>
  </g>

  <path d="M 160 74 L 160 110" stroke="#ff6600" stroke-width="2" fill="none"/>
  
  <path d="M 50 110 L 270 110" stroke="#ff6600" stroke-width="2" fill="none"/>


  <path d="M 50 110 L 50 138" stroke="#dd1111" stroke-width="2" fill="none" marker-end="url(#prov-arr-red)"/>

  <g transform="translate(10, 140)">
    <rect width="130" height="52" rx="6" fill="#0f1217" stroke="#dd1111" stroke-width="2"/>
    <text x="65" y="23" fill="#dce2eb" class="prov-v-subtitle" text-anchor="middle">Signal &gt;</text>
    <text x="65" y="37" fill="#dce2eb" class="prov-v-subtitle" text-anchor="middle">Narrative</text>
  </g>

  <path d="M 270 110 L 270 138" stroke="#dd1111" stroke-width="2" fill="none" marker-end="url(#prov-arr-red)"/>

  <g transform="translate(180, 140)">
    <rect width="130" height="52" rx="6" fill="#0f1217" stroke="#dd1111" stroke-width="2"/>
    <text x="65" y="23" fill="#dce2eb" class="prov-v-subtitle" text-anchor="middle">Recoverability &gt;</text>
    <text x="65" y="37" fill="#dce2eb" class="prov-v-subtitle" text-anchor="middle">Completion</text>
  </g>


  <path d="M 75 192 L 75 220 L 160 220" stroke="#6a3a8a" stroke-width="2" fill="none"/>
  <path d="M 245 192 L 245 220 L 160 220" stroke="#6a3a8a" stroke-width="2" fill="none"/>
  <path d="M 160 220 L 160 238" stroke="#6a3a8a" stroke-width="2" fill="none" marker-end="url(#prov-arr-purple)"/>

  <g transform="translate(60, 240)">
    <rect width="200" height="52" rx="6" fill="#0f1217" stroke="#6a3a8a" stroke-width="2"/>
    <text x="100" y="24" fill="#8a5aaa" class="prov-v-title" text-anchor="middle">Epistemic</text>
    <text x="100" y="38" fill="#8a5aaa" class="prov-v-title" text-anchor="middle">Isolation</text>
  </g>


  <path d="M 160 292 L 160 338" stroke="#ff6600" stroke-width="2" fill="none" marker-end="url(#prov-arr-orange)"/>

  <g transform="translate(60, 340)">
    <rect width="200" height="52" rx="6" fill="#0f1217" stroke="#ff6600" stroke-width="2"/>
    <text x="100" y="24" fill="#ff8833" class="prov-v-title" text-anchor="middle">Observable</text>
    <text x="100" y="38" fill="#ff8833" class="prov-v-title" text-anchor="middle">Drift</text>
  </g>

</svg>