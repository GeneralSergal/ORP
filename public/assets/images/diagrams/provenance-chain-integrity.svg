<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" width="100%" height="100%" style="display: block; margin: 0 auto; background: transparent;">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Oxanium:wght@700;800&amp;family=Space+Grotesk:wght@500&amp;display=swap');
      .drift-v-title { font-family: 'Oxanium', sans-serif; font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; }
      .drift-v-subtitle { font-family: 'Space Grotesk', sans-serif; font-size: 10.5px; font-weight: 500; letter-spacing: 0.01em; opacity: 0.85; }
    </style>

    <marker id="drift-arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 Z" fill="#dd1111"/>
    </marker>
    <marker id="drift-arr-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 Z" fill="#ff6600"/>
    </marker>
    <marker id="drift-arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 Z" fill="#8a5aaa"/>
    </marker>
  </defs>

  <g transform="translate(60, 20)">
    <rect width="200" height="50" rx="6" fill="#0f1217" stroke="#dd1111" stroke-width="2"/>
    <text x="100" y="29" fill="#dce2eb" class="drift-v-title" text-anchor="middle">Raw Signal Context</text>
  </g>

  <path d="M 160 70 L 160 103" stroke="#dd1111" stroke-width="2" fill="none" marker-end="url(#drift-arr-red)"/>

  <g transform="translate(60, 110)">
    <rect width="200" height="50" rx="6" fill="#0f1217" stroke="#dd1111" stroke-width="2"/>
    <text x="100" y="23" fill="#dce2eb" class="drift-v-title" text-anchor="middle">Anomaly Logged</text>
    <text x="100" y="37" fill="#8a95a5" class="drift-v-subtitle" text-anchor="middle">(no summarization)</text>
  </g>

  <path d="M 160 160 L 160 193" stroke="#ff6600" stroke-width="1.75" fill="none" marker-end="url(#drift-arr-orange)"/>

  <g transform="translate(60, 200)">
    <rect width="200" height="50" rx="6" fill="#161a22" stroke="#ff6600" stroke-width="2"/>
    <text x="100" y="29" fill="#ff8833" class="drift-v-title" text-anchor="middle">σ² Telemetry Binding</text>
  </g>

  <path d="M 160 250 L 160 283" stroke="#ff6600" stroke-width="1.75" fill="none" marker-end="url(#drift-arr-orange)"/>

  <g transform="translate(60, 290)">
    <rect width="200" height="50" rx="6" fill="#161a22" stroke="#ff6600" stroke-width="2"/>
    <text x="100" y="23" fill="#f0f4f9" class="drift-v-title" text-anchor="middle">Coherence Camouflage</text>
    <text x="100" y="37" fill="#f0f4f9" class="drift-v-title" text-anchor="middle">Rejection Check</text>
  </g>

  <path d="M 160 340 L 160 373" stroke="#ff6600" stroke-width="1.75" fill="none" marker-end="url(#drift-arr-orange)"/>


  <g transform="translate(160, 380)">
    <polygon points="0 0, 80 23, 0 46, -80 23" fill="#212630" stroke="#8a5aaa" stroke-width="2"/>
    <text x="0" y="20" fill="#f0f4f9" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">Coherent but</text>
    <text x="0" y="31" fill="#f0f4f9" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">degraded?</text>
  </g>


  <path d="M 240 403 L 268 403 L 268 438" stroke="#ff6600" stroke-width="1.5" fill="none" marker-end="url(#drift-arr-orange)"/>
  <text x="250" y="396" fill="#8a95a5" font-family="sans-serif" font-size="9" font-weight="bold">NO</text>
  
  <g transform="translate(210, 440)">
    <rect width="100" height="30" rx="4" fill="#161a22" stroke="#ff6600" stroke-width="1.5"/>
    <text x="50" y="18" fill="#ff8833" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">Step 08 Sealed</text>
  </g>

  <path d="M 80 403 L 52 403 L 52 438" stroke="#dd1111" stroke-width="1.5" fill="none" marker-end="url(#drift-arr-red)"/>
  <text x="60" y="396" fill="#ff4d4d" font-family="sans-serif" font-size="9" font-weight="bold">YES</text>

  <g transform="translate(10, 440)">
    <rect width="100" height="30" rx="4" fill="#1a0000" stroke="#dd1111" stroke-width="1.5"/>
    <text x="50" y="18" fill="#ff4d4d" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">Flagged Review</text>
  </g>

</svg>