<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 620" width="100%" height="100%" style="display: block; margin: 0 auto; background: transparent;">
  <defs>
    <!-- Web Font Injections for Theme Cohesion -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Oxanium:wght@700;800&amp;family=Space+Grotesk:wght@500;700&amp;display=swap');
      .la-v-badge { font-family: 'Oxanium', sans-serif; font-size: 11px; font-weight: 800; letter-spacing: 0.05em; }
      .la-v-text { font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.02em; }
    </style>

    <!-- Flow Arrow Markers matching layered-architecture.svg -->
    <marker id="la-arr-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 Z" fill="#ff6600"/>
    </marker>
    <marker id="la-arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 Z" fill="#dd1111"/>
    </marker>
  </defs>

  <!-- ================= INPUT ANCHOR ================= -->
  <g transform="translate(28, 25)">
    <rect width="264" height="46" rx="23" fill="#0f1217" stroke="#ff6600" stroke-width="2"/>
    <text x="132" y="28" fill="#ff6600" class="la-v-text" text-anchor="middle">External Input</text>
  </g>
  
  <path d="M 160 71 L 160 104" stroke="#ff6600" stroke-width="1.5" fill="none" marker-end="url(#la-arr-orange)"/>


  <!-- ================= L1: TYPED SIGNAL LAYER ================= -->
  <g transform="translate(28, 105)">
    <rect width="264" height="48" rx="6" fill="#0f1217" stroke="#dd1111" stroke-width="1.5"/>
    <text x="20" y="28" fill="#dd1111" class="la-v-badge">L1</text>
    <text x="58" y="29" fill="#f0f4f9" class="la-v-text">Typed Signal Layer</text>
  </g>
  
  <path d="M 160 153 L 160 184" stroke="#dd1111" stroke-width="1.5" fill="none" marker-end="url(#la-arr-red)"/>


  <!-- ================= L2: VALIDATION LAYER ================= -->
  <g transform="translate(28, 185)">
    <rect width="264" height="48" rx="6" fill="#0f1217" stroke="#dd1111" stroke-width="1.5"/>
    <text x="20" y="28" fill="#dd1111" class="la-v-badge">L2</text>
    <text x="58" y="29" fill="#f0f4f9" class="la-v-text">Validation Layer</text>
  </g>
  
  <path d="M 160 233 L 160 264" stroke="#dd1111" stroke-width="1.5" fill="none" marker-end="url(#la-arr-red)"/>


  <!-- ================= L3: GOVERNANCE CORE ================= -->
  <g transform="translate(28, 265)">
    <rect width="264" height="48" rx="6" fill="#0f1217" stroke="#ff6600" stroke-width="1.5"/>
    <text x="20" y="28" fill="#ff6600" class="la-v-badge">L3</text>
    <text x="58" y="29" fill="#f0f4f9" class="la-v-text">Governance Core</text>
  </g>
  
  <!-- Direct execution spine dropping straight through down to Output -->
  <path d="M 160 313 L 160 514" stroke="#ff6600" stroke-width="1.5" fill="none" marker-end="url(#la-arr-orange)"/>


  <!-- ================= L4: PERSONA TRANSFORM (SIDE ELEMENT) ================= -->
  <!-- Left-aligned side engine container matching the exact layout of layered-architecture.svg -->
  <g transform="translate(12, 395)">
    <rect width="124" height="48" rx="6" fill="#0f1217" stroke="#632ca6" stroke-width="1.5"/>
    <text x="16" y="28" fill="#632ca6" class="la-v-badge">L4</text>
    <text x="44" y="29" fill="#f0f4f9" class="la-v-text">Persona</text>
  </g>

  <!-- Purple curved dashed hook interacting with the main pipeline before delivery -->
  <path d="M 74 443 C 74 475, 110 495, 142 503" stroke="#632ca6" stroke-width="1.25" stroke-dasharray="3,3" fill="none"/>


  <!-- ================= TERMINAL OUTPUT ================= -->
  <g transform="translate(28, 515)">
    <rect width="264" height="46" rx="23" fill="#0f1217" stroke="#3fb950" stroke-width="1.5"/>
    <text x="132" y="28" fill="#3fb950" class="la-v-text" text-anchor="middle">System Output</text>
  </g>

</svg>