<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1050" width="100%" height="100%" style="background-color: #0A0A0C; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="redBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF3B3B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF3B3B" stop-opacity="0.1"/>
    </linearGradient>
    
    <linearGradient id="greenBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50" stop-opacity="0.6"/>
