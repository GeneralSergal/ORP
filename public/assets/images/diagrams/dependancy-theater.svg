      <path d="M26.2 3.8C24.4 2 21.6 1.8 19.5 3.1L12.4 10.2L9.6 9.6L4.8 14.4L8.4 18L2 24.4L5.6 28L12 21.6L15.6 25.2L20.4 20.4L19.8 17.6L26.9 10.5C28.2 8.4 28 5.6 26.2 3.8ZM23.4 8.6C22.6 9.4 21.4 9.4 20.6 8.6C19.8 7.8 19.8 6.6 20.6 5.8C21.4 5 22.6 5 23.4 5.8C24.2 6.6 24.2 7.8 23.4 8.6Z" fill="#FF3B3B"/>
    </g>
