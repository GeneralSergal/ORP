  <line x1="50" y1="780" x2="750" y2="780" stroke="#4CAF50" stroke-opacity="0.2" stroke-width="1"/>
  <line x1="50" y1="900" x2="750" y2="900" stroke="#4CAF50" stroke-opacity="0.2" stroke-width="1"/>
  <line x1="580" y1="660" x2="580" y2="1020" stroke="#4CAF50" stroke-opacity="0.2" stroke-width="1"/>

