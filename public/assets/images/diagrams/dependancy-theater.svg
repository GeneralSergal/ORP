  <rect x="50" y="140" width="700" height="360" rx="12" fill="none" stroke="url(#redBorder)" stroke-width="2"/>
  
  <line x1="50" y1="260" x2="750" y2="260" stroke="#FF3B3B" stroke-opacity="0.2" stroke-width="1"/>
  <line x1="50" y1="380" x2="750" y2="380" stroke="#FF3B3B" stroke-opacity="0.2" stroke-width="1"/>
  <line x1="580" y1="140" x2="580" y2="500" stroke="#FF3B3B" stroke-opacity="0.2" stroke-width="1"/>

