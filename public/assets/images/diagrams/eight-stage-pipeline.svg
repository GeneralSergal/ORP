      .matrix-v-step { font-family: 'Oxanium', sans-serif; font-size: 10px; font-weight: 800; letter-spacing: 0.05em; }
      .matrix-v-text { font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.02em; }
    </style>

    <marker id="matrix-arr-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
