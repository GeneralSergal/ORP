<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

  <!--
    ORP Δ — Icon Sprite Sheet
    Usage: <svg width="32" height="32"><use href="assets/icons.svg#logo-mark"/></svg>

    Geometry: true equilateral triangles, each scaled 0.55× from the shared
    centroid (50, 61.3) so they stack cleanly inside one another.
    viewBox: 0 0 100 100
  -->

  <symbol id="logo-mark" viewBox="0 0 100 100">
    <defs>
      <filter id="lg" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="2" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
    <!-- Outer — apex 8, base 88 -->
    <polygon points="50,8 3.8,88 96.2,88"
             fill="none" stroke="#dd1111" stroke-width="5.5" stroke-linejoin="round"
             filter="url(#lg)"/>
    <!-- Mid — scaled 0.55× from centroid (50, 61.33) -->
    <polygon points="50,32 24.6,76 75.4,76"
             fill="none" stroke="#ff4400" stroke-width="4.5" stroke-linejoin="round"
             filter="url(#lg)"/>
    <!-- Inner — scaled 0.55× again from same centroid -->
    <polygon points="50,45.2 36,69.4 64,69.4"
             fill="none" stroke="#ff6600" stroke-width="3.5" stroke-linejoin="round"
             filter="url(#lg)"/>
  </symbol>

  <!-- Favicon mark — same geometry, no glow, for embedding glyph alone -->
  <symbol id="favicon-mark" viewBox="0 0 100 100">
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="50,8 3.8,88 96.2,88"  stroke="#dd1111" stroke-width="7"/>
      <polygon points="50,32 24.6,76 75.4,76" stroke="#ff4400" stroke-width="6"/>
      <polygon points="50,45.2 36,69.4 64,69.4" stroke="#ff6600" stroke-width="5"/>
    </g>
  </symbol>

</svg>
