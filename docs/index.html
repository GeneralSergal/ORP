<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>ORP Documentation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Docsify Core -->
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>

    <!-- Dark Material Theme -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">

    <!-- ORP Custom Theme -->
    <style>
      :root {
        --theme-color: #dd1111;
        --base-background-color: #0a0d10;
        --sidebar-background: #0f1318;
        --sidebar-border-color: rgba(255,255,255,0.06);
        --sidebar-nav-link-color: #d7dde7;
        --sidebar-nav-link-hover-color: #ff3333;
        --sidebar-nav-link-active-color: #ff3333;
        --heading-color: #f3f6fb;
        --text-color: #d7dde7;
        --link-color: #dd1111;
        --code-background: #131a22;
        --code-color: #e0e0e0;
      }

      /* Scroll progress bar */
      .scroll-progress {
        position: fixed;
        top: 0;
        left: 0;
        height: 3px;
        width: 0%;
        background: linear-gradient(90deg, #dd1111, #ff6600);
        z-index: 2000;
      }

      /* Floating TOC */
      .toc-panel {
        position: fixed;
        top: 120px;
        right: 40px;
        width: 180px;
        padding: 18px 20px;
        border-radius: 16px;
        background: rgba(15,19,24,0.7);
        border: 1px solid rgba(255,255,255,0.06);
        backdrop-filter: blur(12px);
        z-index: 900;
      }

      .toc-title {
        font-family: Oxanium, sans-serif;
        font-size: 0.75rem;
        letter-spacing: 0.14em;
        color: #ff6600;
        margin-bottom: 12px;
      }

      .toc-panel a {
        display: block;
        margin-bottom: 10px;
        color: #8f9bb0;
        font-size: 0.9rem;
        transition: color 180ms;
      }

      .toc-panel a:hover {
        color: #ff3333;
      }

      /* Reveal animations */
      .reveal {
        opacity: 0;
        transform: translateY(40px);
        transition: all 700ms cubic-bezier(.2,.8,.2,1);
      }

      .reveal.visible {
        opacity: 1;
        transform: translateY(0);
      }

      /* Scroll to top */
      .scroll-top {
        position: fixed;
        bottom: 40px;
        right: 40px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.12);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        opacity: 0;
        transition: opacity 180ms;
        z-index: 900;
      }

      .scroll-top.visible {
        opacity: 1;
      }
    </style>
  </head>

  <body>
    <div class="scroll-progress"></div>

    <div class="toc-panel">
      <div class="toc-title">DOCUMENT MAP</div>
      <a href="#overview">Overview</a>
      <a href="#documentation-structure">Structure</a>
      <a href="#version">Version</a>
      <a href="#license">License</a>
    </div>

    <div id="app"></div>

    <div class="scroll-top">↑</div>

    <script>
      window.$docsify = {
        name: "ORP v3.0",
        repo: "GeneralSergal/ORP",
        loadSidebar: true,
        subMaxLevel: 3,
        auto2top: true,
        themeColor: "#dd1111",
        search: {
          maxAge: 86400000,
          paths: "auto",
          placeholder: "Search ORP...",
          noData: "No results"
        }
      };

      /* Scroll progress bar */
      window.addEventListener("scroll", () => {
        const scrolled = (window.scrollY / (document.body.scrollHeight - window.innerHeight)) * 100;
        document.querySelector(".scroll-progress").style.width = scrolled + "%";
      });

      /* Scroll to top button */
      const topBtn = document.querySelector(".scroll-top");
      window.addEventListener("scroll", () => {
        topBtn.classList.toggle("visible", window.scrollY > 400);
      });
      topBtn.onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });

      /* Reveal animations */
      const observer = new IntersectionObserver(entries => {
        entries.forEach(e => {
          if (e.isIntersecting) e.target.classList.add("visible");
        });
      });

      setTimeout(() => {
        document.querySelectorAll("section, h1, h2, h3, p, ul, li").forEach(el => {
          el.classList.add("reveal");
          observer.observe(el);
        });
      }, 500);
    </script>

    <!-- Plugins -->
    <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/emoji.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  </body>
</html>
