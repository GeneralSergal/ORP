<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- Primary Meta -->
  <title>ORP Documentation — Open Resonance Protocol</title>

  <meta
    name="description"
    content="ORP v3.0 — Type-Safe Epistemic Governance Framework for runtime governance, drift observability, provenance preservation, and structured reasoning evaluation."
  />

  <meta
    name="keywords"
    content="ORP, Open Resonance Protocol, epistemic governance, reasoning framework, drift observability, provenance preservation, SHS, LAS, coherence camouflage"
  />

  <meta name="author" content="GeneralSergal" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#58a6ff" />
  <meta name="color-scheme" content="dark" />

  <!-- Open Graph -->
  <meta property="og:title" content="ORP Documentation — Open Resonance Protocol" />
  <meta
    property="og:description"
    content="Type-Safe Epistemic Governance Framework for recoverable reasoning and drift-observable inference."
  />
  <meta property="og:type" content="website" />

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' rx='24' fill='%230d1117'/%3E%3Cpath d='M64 16 L112 64 L64 112 L16 64 Z' fill='%2358a6ff'/%3E%3C/svg%3E"
  />

  <!-- Docsify Theme -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css"
  />

  <!-- Prism -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/prismjs@1/themes/prism-tomorrow.min.css"
  />

  <style>
    :root {
      /* Core Palette */
      --theme-color: #58a6ff;
      --theme-color-secondary: #79c0ff;

      /* Backgrounds */
      --base-background-color: #0d1117;
      --content-max-width: 1100px;
      --content-background-color: #0d1117;
      --sidebar-background: #161b22;
      --code-background: #161b22;

      /* Borders */
      --border-color: #30363d;
      --sidebar-border-color: #30363d;

      /* Text */
      --text-color-base: #c9d1d9;
      --text-color-secondary: #8b949e;
      --heading-color: #f0f6fc;

      /* Links */
      --link-color: #79c0ff;
      --link-color-hover: #a5d6ff;

      /* Sidebar */
      --sidebar-nav-link-color: #c9d1d9;
      --sidebar-nav-link-color--active: #58a6ff;
      --sidebar-nav-link-border-color--active: #58a6ff;

      /* Tables */
      --table-head-background: #161b22;
      --table-row-odd-background: rgba(88, 166, 255, 0.03);

      /* Search */
      --search-input-background-color: #0d1117;
      --search-input-border-color: #30363d;
      --search-input-color: #c9d1d9;

      /* Misc */
      --selection-color: rgba(88, 166, 255, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #0d1117;
      color: #c9d1d9;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      overflow-x: hidden;
    }

    ::selection {
      background: var(--selection-color);
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-track {
      background: #0d1117;
    }

    ::-webkit-scrollbar-thumb {
      background: #30363d;
      border-radius: 999px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #484f58;
    }

    /* Sidebar */
    .sidebar {
      background: var(--sidebar-background);
      border-right: 1px solid var(--sidebar-border-color);
    }

    .sidebar-toggle {
      background: #161b22;
      border-right: 1px solid #30363d;
    }

    .app-name {
      color: #f0f6fc;
      font-weight: 700;
      letter-spacing: 0.04em;
      font-size: 1.1rem;
      padding-top: 0.3rem;
      padding-bottom: 0.3rem;
    }

    .app-name-link {
      color: inherit !important;
    }

    .sidebar nav li.active > a {
      font-weight: 600;
    }

    .sidebar ul li a {
      transition:
        color 0.15s ease,
        transform 0.15s ease;
    }

    .sidebar ul li a:hover {
      color: #79c0ff;
      transform: translateX(2px);
    }

    /* Main */
    .content {
      padding-top: 2rem;
    }

    .markdown-section {
      max-width: 1100px;
      padding: 2rem 3rem;
    }

    /* Typography */
    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3,
    .markdown-section h4 {
      color: var(--heading-color);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .markdown-section h1 {
      font-size: 2.4rem;
      border-bottom: 2px solid #30363d;
      padding-bottom: 0.8rem;
      margin-bottom: 2rem;
    }

    .markdown-section h2 {
      margin-top: 3rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid #30363d;
    }

    .markdown-section p,
    .markdown-section li {
      line-height: 1.75;
    }

    /* Links */
    .markdown-section a {
      color: var(--link-color);
      font-weight: 500;
    }

    .markdown-section a:hover {
      color: var(--link-color-hover);
      text-decoration: none;
    }

    /* Code */
    .markdown-section code {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #79c0ff;
      padding: 0.15rem 0.45rem;
      font-size: 0.9em;
    }

    .markdown-section pre {
      background: #161b22 !important;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 1rem;
      overflow: auto;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.02);
    }

    .markdown-section pre code {
      border: none;
      padding: 0;
      color: #c9d1d9;
    }

    /* Blockquotes */
    .markdown-section blockquote {
      border-left: 4px solid #58a6ff;
      background: rgba(88, 166, 255, 0.06);
      border-radius: 0 8px 8px 0;
      padding: 0.8rem 1rem;
      color: #c9d1d9;
    }

    /* Tables */
    .markdown-section table {
      display: table;
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 10px;
      border: 1px solid #30363d;
    }

    .markdown-section table th {
      background: #161b22;
      color: #f0f6fc;
      font-weight: 700;
    }

    .markdown-section table th,
    .markdown-section table td {
      border: 1px solid #30363d;
      padding: 0.8rem 1rem;
    }

    .markdown-section table tr:nth-child(odd) {
      background: rgba(88, 166, 255, 0.03);
    }

    /* Search */
    .search {
      margin-bottom: 1rem;
      padding: 0 1rem;
    }

    .search input {
      width: 100%;
      background: #0d1117;
      border: 1px solid #30363d;
      color: #c9d1d9;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease;
    }

    .search input:focus {
      outline: none;
      border-color: #58a6ff;
      box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
    }

    .search input::placeholder {
      color: #8b949e;
    }

    .results-panel {
      background: #161b22 !important;
      border: 1px solid #30363d !important;
      border-radius: 10px;
      overflow: hidden;
    }

    .matching-post {
      border-bottom: 1px solid #30363d !important;
    }

    /* Copy button */
    .docsify-copy-code-button {
      background: #21262d !important;
      border: 1px solid #30363d !important;
      color: #c9d1d9 !important;
      border-radius: 6px !important;
    }

    .docsify-copy-code-button:hover {
      background: #30363d !important;
    }

    /* Pagination */
    .pagination-item-label,
    .pagination-item-title {
      color: #c9d1d9 !important;
    }

    /* Footer */
    .footer {
      border-top: 1px solid #30363d;
      color: #8b949e;
    }

    /* Mermaid */
    .mermaid {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 1rem;
      overflow: auto;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .markdown-section {
        padding: 1.25rem;
      }

      .markdown-section h1 {
        font-size: 2rem;
      }

      .markdown-section h2 {
        font-size: 1.4rem;
      }
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <div id="app">Loading ORP Documentation...</div>

  <script>
    window.$docsify = {
      name: "ORP",
      repo: "https://github.com/GeneralSergal/ORP",

      homepage: "README.md",

      loadSidebar: true,
      loadNavbar: false,

      auto2top: true,
      subMaxLevel: 3,
      maxLevel: 4,

      coverpage: false,
      mergeNavbar: true,

      themeColor: "#58a6ff",

      alias: {
        "/.*/_sidebar.md": "/_sidebar.md"
      },

      search: {
        maxAge: 86400000,
        paths: "auto",
        placeholder: "Search ORP documentation...",
        noData: "No matching documents found.",
        depth: 6,
        hideOtherSidebarContent: false
      },

      pagination: {
        previousText: "Previous",
        nextText: "Next",
        crossChapter: true,
        crossChapterText: true
      },

      copyCode: {
        buttonText: "Copy",
        errorText: "Error",
        successText: "Copied"
      },

      markdown: {
        smartypants: true,
        breaks: false
      },

      externalLinkTarget: "_blank",

      executeScript: true,

      notFoundPage: true,

      formatUpdated: "{MM}/{DD}/{YYYY} {HH}:{mm}",

      plugins: [
        function(hook) {
          hook.doneEach(function() {
            document.title =
              document.title.includes("ORP")
                ? document.title
                : document.title + " — ORP";
          });
        }
      ]
    };
  </script>

  <!-- Docsify -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>

  <!-- Search -->
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>

  <!-- Zoom -->
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>

  <!-- Copy Code -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>

  <!-- Pagination -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>

  <!-- Prism -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-markdown.min.js"></script>

  <!-- Mermaid -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>

  <script>
    mermaid.initialize({
      startOnLoad: true,
      theme: "dark",
      securityLevel: "loose"
    });
  </script>
</body>
</html>
